<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rejseliste</title>
<meta name="theme-color" content="#5b4acb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rejseliste">

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f4fb;
  color:#222;
}

button,input { font:inherit; }
button { cursor:pointer; }

header {
  background:white;
  padding:20px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

.hidden { display:none!important; }

.app {
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:280px 1fr 300px;
  gap:18px;
  padding:18px;
}

.panel {
  background:white;
  border-radius:20px;
  padding:18px;
  min-width:0;
}

h2,h3 { margin:0 0 18px; }

.user-bar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
  color:#666;
  font-size:13px;
}

.logout-btn {
  border:0;
  background:#eee;
  padding:9px;
  border-radius:10px;
}

.btn {
  background:#5b4acb;
  color:white;
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
}

.btn.block {
  display:block;
  width:100%;
  margin:14px 0;
}

.btn.light {
  background:#eee;
  color:#222;
}

.icon-btn {
  border:0;
  background:#eee;
  border-radius:12px;
  width:40px;
  height:40px;
  flex-shrink:0;
  font-size:21px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.input {
  width:100%;
  min-width:0;
  padding:14px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:12px;
  margin-bottom:12px;
}

.check {
  width:25px;
  height:25px;
  flex-shrink:0;
  accent-color:#5b4acb;
  cursor:pointer;
}

.category {
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  margin:11px 0;
  background:#f2f0fb;
  border-radius:15px;
  min-height:70px;
}

.category.active { background:#ddd8ff; }

.category-name {
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
  cursor:pointer;
  overflow-wrap:anywhere;
}

.category-name .emoji { font-size:24px; }

.progress {
  color:#666;
  font-size:14px;
  white-space:nowrap;
}

.heading-row {
  display:flex;
  align-items:center;
  gap:10px;
}

.heading-row h2 {
  flex:1;
  min-width:0;
  margin:0;
  overflow-wrap:anywhere;
}

.muted {
  color:#666;
  font-size:15px;
}

.quick-add {
  display:flex;
  align-items:center;
  gap:10px;
  margin:24px 0;
}

.quick-add input {
  flex:1;
  margin:0;
}

.section {
  background:#fafaff;
  border:1px solid #e9e9ee;
  border-radius:17px;
  padding:13px;
  margin:18px 0;
}

.section.default-section {
  border:0;
  background:transparent;
  padding:0;
  margin:10px 0;
}

.section-header {
  display:flex;
  align-items:center;
  gap:8px;
  min-height:45px;
}

.section-title {
  font-size:20px;
  font-weight:bold;
  flex:1;
  min-width:0;
  cursor:pointer;
  overflow-wrap:anywhere;
}

.section-count {
  font-size:14px;
  font-weight:normal;
  color:#666;
  white-space:nowrap;
}

.collapse {
  border:0;
  background:transparent;
  font-size:19px;
  padding:5px;
}

.section-drop {
  min-height:12px;
}

.item,.missing-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #eee;
  font-size:17px;
}

.item-name {
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.item.done .item-name {
  text-decoration:line-through;
  color:#999;
}

.dragging {
  opacity:.45;
  background:#eeeaff!important;
}

.drag-over {
  background:#eeeaff!important;
  outline:2px dashed #5b4acb;
  border-radius:12px;
}

.edit-box {
  background:#fff2c6;
  border-radius:13px;
  padding:13px;
  margin-bottom:18px;
  font-size:14px;
}

.missing-category {
  border-top:2px solid #eee;
  margin-top:20px;
  padding-top:15px;
}

.missing-category-title {
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

.missing-section-name {
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.empty-message {
  background:#f2f0fb;
  padding:16px;
  border-radius:14px;
}

.login-wrap {
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}

.login-card {
  background:white;
  width:100%;
  max-width:420px;
  padding:28px;
  border-radius:26px;
  box-shadow:0 8px 30px #0002;
}

.login-card h1 {
  text-align:center;
  font-size:34px;
}

.login-card p {
  text-align:center;
  color:#666;
}

.error {
  color:#b00020;
  text-align:center;
  margin-top:12px;
}

.mobile-nav { display:none; }

@media(max-width:800px) {
  .app {
    display:block;
    padding:14px;
  }

  .panel { margin-bottom:16px; }

  .screen { display:none; }
  .screen.active { display:block; }

  .mobile-nav {
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:20;
    background:white;
    border-top:1px solid #ddd;
    justify-content:space-around;
    padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  }

  .mobile-nav button {
    border:0;
    background:transparent;
    font-size:12px;
    flex:1;
    color:#333;
  }

  body { padding-bottom:90px; }

  .icon-btn {
    width:37px;
    height:37px;
    font-size:19px;
  }

  .section-title { font-size:19px; }
  .progress { font-size:13px; }
}
</style>
</head>

<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h1>🧳 Rejseliste</h1>
    <p>Log ind for at se familiens pakkeliste</p>

    <input id="emailInput" class="input"
      type="email" placeholder="Email" autocomplete="email">

    <input id="passwordInput" class="input"
      type="password" placeholder="Kodeord"
      autocomplete="current-password">

    <button class="btn block" id="loginButton">Log ind</button>
    <button class="btn block light" id="signupButton">Opret bruger</button>

    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="appShell" class="hidden">

<header>Rejseliste</header>

<main class="app">

<section id="listScreen" class="panel screen active">

  <div class="user-bar">
    <span id="userEmail"></span>
    <button class="logout-btn" id="logoutButton">Log ud</button>
  </div>

  <h2>Kategorier</h2>

  <button class="btn block" id="missingShortcut">
    📋 Se hvad der mangler
  </button>

  <button class="btn block" id="newTripShortcut">
    ↻ Start ny rejse
  </button>

  <div id="categoryList"></div>

  <h3 style="margin-top:28px">Tilføj kategori</h3>

  <input id="newCategoryEmojiInput" class="input"
    placeholder="Emoji, fx 🧳">

  <input id="newCategoryInput" class="input"
    placeholder="Kategorinavn">

  <button class="btn block" id="addCategoryButton">
    Tilføj kategori
  </button>

</section>

<section id="detailScreen" class="panel screen">

  <div id="editBox2" class="edit-box hidden">
    Redigering er slået til. Brug ✏️ for at redigere
    og 🗑️ for at slette.
  </div>

  <div id="selectedCategoryTitle" class="heading-row"></div>

  <p id="selectedProgress" class="muted"></p>

  <form id="quickAddForm" class="quick-add">
    <input id="quickItemInput" class="input"
      placeholder="Tilføj ting, fx Pas" required>

    <button class="btn" type="submit">Tilføj</button>
  </form>

  <div id="sectionsList"></div>

</section>

<section id="addScreen" class="panel screen">

  <h2>Tilføj ny ting</h2>

  <form id="addItemForm">
    <label for="newItemInput">Navn på ting</label>
    <input id="newItemInput" class="input"
      placeholder="Fx Pas" required>

    <h3>Vælg kategorier</h3>
    <div id="categoryCheckboxes"></div>

    <button class="btn block" type="submit">Gem</button>
  </form>

</section>

<section id="missingScreen" class="panel screen">

  <h2>📋 Det mangler vi</h2>
  <p id="missingSummary"></p>
  <div id="missingList"></div>

</section>

</main>

<nav class="mobile-nav">
  <button data-screen="listScreen">📋<br>Liste</button>
  <button data-screen="addScreen">➕<br>Tilføj</button>
  <button data-screen="missingScreen">🧾<br>Mangler</button>
  <button id="editNavButton">✏️<br>Rediger</button>
  <button id="newTripNavButton">↻<br>Ny rejse</button>
</nav>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
  getDatabase, ref, onValue, runTransaction
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

import {
  getAuth, onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyDlKEP7_KezbNVEviM77GrvlH8u68vNwTQ",
  authDomain:"pakkeliste-a8089.firebaseapp.com",
  databaseURL:"https://pakkeliste-a8089-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId:"pakkeliste-a8089",
  storageBucket:"pakkeliste-a8089.firebasestorage.app",
  messagingSenderId:"359809963583",
  appId:"1:359809963583:web:7a98e4e94bd2fd3fdb8a8a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const FAMILY_ID = "rykov";
const DEFAULT = "__default__";

const $ = id => document.getElementById(id);

let data = {categories:[]};
let selectedCategory = "";
let currentScreen = "listScreen";
let editMode = false;
let unsubscribe = null;
let dataRef = null;
let loaded = false;
let saveQueue = Promise.resolve();

const initialData = {
  categories:[
    {
      name:"Pernille",icon:"👩",
      sections:[
        {name:DEFAULT,collapsed:false,items:[
          {name:"Pas",done:false}
        ]},
        {name:"Tøj",collapsed:false,items:[
          {name:"Underbukser",done:false},
          {name:"BH’er",done:false},
          {name:"Sokker",done:false}
        ]}
      ]
    },
    {
      name:"Michael",icon:"👨",
      sections:[
        {name:DEFAULT,collapsed:false,items:[
          {name:"Pas",done:false}
        ]},
        {name:"Tøj",collapsed:false,items:[
          {name:"Underbukser",done:false},
          {name:"Strømper",done:false}
        ]}
      ]
    },
    {
      name:"Oliver",icon:"👦",
      sections:[
        {name:"Tøj",collapsed:false,items:[
          {name:"Underbukser",done:false},
          {name:"Undertrøjer",done:false},
          {name:"Sokker",done:false},
          {name:"Bukser",done:false},
          {name:"Trøje",done:false},
          {name:"T-shirt",done:false}
        ]},
        {name:"Overtøj",collapsed:false,items:[
          {name:"Hue - kold",done:false},
          {name:"Jakke",done:false}
        ]}
      ]
    },
    {
      name:"Emma",icon:"👧",
      sections:[
        {name:DEFAULT,collapsed:false,items:[
          {name:"Pas",done:false}
        ]},
        {name:"Tøj",collapsed:false,items:[
          {name:"Tøj",done:false},
          {name:"Nattøj",done:false}
        ]}
      ]
    }
  ]
};

function asArray(value) {
  if(Array.isArray(value)) return value;
  if(!value || typeof value!=="object") return [];
  return Object.keys(value)
    .sort((a,b)=>Number(a)-Number(b))
    .map(k=>value[k]);
}

function normalizeData(raw) {
  return {
    categories:asArray(raw?.categories).filter(Boolean).map(c=>{
      let sections=asArray(c.sections).filter(Boolean);

      if(!sections.length && c.items) {
        sections=[{name:DEFAULT,items:c.items}];
      }

      sections=sections.map(s=>({
        name:s.name||DEFAULT,
        collapsed:!!s.collapsed,
        items:asArray(s.items).filter(Boolean).map(i=>({
          name:i.name||"Uden navn",
          done:!!i.done
        }))
      }));

      if(!sections.some(s=>s.name===DEFAULT)) {
        sections.unshift({
          name:DEFAULT,collapsed:false,items:[]
        });
      }

      return {
        name:c.name||"Uden navn",
        icon:c.icon||"",
        sections
      };
    })
  };
}

function getCategory() {
  return data.categories.find(c=>c.name===selectedCategory);
}

function getDefaultSection(category) {
  let s=category.sections.find(x=>x.name===DEFAULT);
  if(!s) {
    s={name:DEFAULT,collapsed:false,items:[]};
    category.sections.unshift(s);
  }
  return s;
}

function allItems(category) {
  return category.sections.flatMap(s=>s.items);
}

function countDone(category) {
  return allItems(category).filter(i=>i.done).length;
}

function checkboxState(items) {
  if(!items.length) return {checked:false,partial:false};
  const done=items.filter(i=>i.done).length;
  return {
    checked:done===items.length,
    partial:done>0 && done<items.length
  };
}

function createElement(tag,className="",text="") {
  const el=document.createElement(tag);
  if(className) el.className=className;
  if(text!==undefined) el.textContent=text;
  return el;
}

function iconButton(symbol,label,callback) {
  const btn=createElement("button","icon-btn",symbol);
  btn.type="button";
  btn.setAttribute("aria-label",label);
  btn.onclick=callback;
  return btn;
}

function createCheckbox(items,onChange,label) {
  const box=document.createElement("input");
  box.type="checkbox";
  box.className="check";

  const state=checkboxState(items);
  box.checked=state.checked;
  box.indeterminate=state.partial;

  box.setAttribute("aria-label",label);
  box.onclick=e=>e.stopPropagation();

  box.onchange=e=>{
    e.stopPropagation();
    onChange(box.checked);
  };

  return box;
}

/*
  Ændringer gemmes med transaktioner.
  Det mindsker risikoen for, at to samtidige
  ændringer fra forskellige telefoner overskriver
  hinanden.
*/

function mutate(callback) {
  if(!loaded || !dataRef) return;

  const activeRef=dataRef;

  saveQueue=saveQueue.catch(()=>{}).then(async()=>{
    await runTransaction(activeRef,current=>{
      if(current===null) return;

      const next=normalizeData(current);
      callback(next);
      return next;
    },{applyLocally:false});
  }).catch(error=>{
    console.error(error);
    alert("Kunne ikke gemme ændringen i Firebase.");
  });
}

function updateCategory(name,callback) {
  mutate(next=>{
    const c=next.categories.find(x=>x.name===name);
    if(c) callback(c);
  });
}

function render() {
  renderCategories();
  renderDetail();
  renderCategoryCheckboxes();
  renderMissing();
  $("editBox2").classList.toggle("hidden",!editMode);
  $("editNavButton").style.display=
    currentScreen==="detailScreen" ? "block" : "none";
}

/* FORSIDE */

function renderCategories() {
  const root=$("categoryList");
  root.replaceChildren();

  data.categories.forEach(c=>{
    const row=createElement("div","category");

    if(c.name===selectedCategory) row.classList.add("active");

    const items=allItems(c);

    const check=createCheckbox(items,checked=>{
      updateCategory(c.name,cat=>{
        allItems(cat).forEach(i=>i.done=checked);
      });
    },"Afkryds hele "+c.name);

    const name=createElement("div","category-name");

    name.append(
      createElement("span","emoji",c.icon),
      createElement("span","",c.name)
    );

    name.onclick=()=>{
      selectedCategory=c.name;
      showScreen("detailScreen");
    };

    const progress=createElement(
      "span","progress",countDone(c)+" / "+items.length
    );

    row.append(check,name,progress);
    root.append(row);
  });
}

/* KATEGORIDETALJER */

function renderDetail() {
  const c=getCategory();
  const title=$("selectedCategoryTitle");
  const progress=$("selectedProgress");
  const root=$("sectionsList");

  title.replaceChildren();
  root.replaceChildren();

  if(!c) {
    title.append(createElement("h2","","Vælg en kategori"));
    progress.textContent="";
    $("quickAddForm").classList.add("hidden");
    return;
  }

  $("quickAddForm").classList.remove("hidden");

  title.append(
    createElement("h2","",c.icon+" "+c.name)
  );

  // Plusset opretter nu en UNDERKATEGORI.
  title.append(
    iconButton("＋","Tilføj underkategori",addSection)
  );

  if(editMode) {
    title.append(
      iconButton("✏️","Rediger kategori",editCategory),
      iconButton("🗑️","Slet kategori",deleteCategory)
    );
  }

  progress.textContent=
    countDone(c)+" / "+allItems(c).length+" færdige";

  c.sections.forEach((section,si)=>{
    const isDefault=section.name===DEFAULT;

    const card=createElement(
      "div",
      isDefault ? "section default-section" : "section"
    );

    if(!isDefault) {
      const header=createElement("div","section-header");

      const collapse=createElement(
        "button","collapse",
        section.collapsed ? "▸" : "▾"
      );

      collapse.onclick=()=>toggleCollapse(si);

      // Afkryds hele underkategorien.
      const check=createCheckbox(section.items,checked=>{
        updateCategory(c.name,cat=>{
          const s=cat.sections[si];
          if(s) s.items.forEach(i=>i.done=checked);
        });
      },"Afkryds hele "+section.name);

      const name=createElement(
        "div","section-title",section.name
      );

      name.onclick=()=>toggleCollapse(si);

      const count=createElement(
        "span","section-count",
        section.items.filter(i=>i.done).length+
        " / "+section.items.length
      );

      const add=iconButton(
        "＋","Tilføj ting til "+section.name,
        ()=>addItemToSection(si)
      );

      header.append(collapse,check,name,count,add);

      if(editMode) {
        header.append(
          iconButton("✏️","Rediger underkategori",
            ()=>editSection(si)),
          iconButton("🗑️","Slet underkategori",
            ()=>deleteSection(si))
        );
      }

      card.append(header);

      card.draggable=true;

      wireDrag(card,{type:"section",si},payload=>{
        if(payload.type==="section")
          moveSection(payload.si,si);
      });
    }

    const drop=createElement("div","section-drop");

    wireDrop(drop,payload=>{
      if(payload.type==="item")
        moveItem(payload.si,payload.ii,si,section.items.length);
    });

    if(isDefault || !section.collapsed) {
      section.items.forEach((item,ii)=>{
        const row=createElement("div","item");

        if(item.done) row.classList.add("done");

        const box=document.createElement("input");
        box.type="checkbox";
        box.className="check";
        box.checked=item.done;
        box.setAttribute("aria-label",item.name);

        box.onchange=()=>{
          updateCategory(c.name,cat=>{
            const target=cat.sections[si]?.items[ii];
            if(target) target.done=box.checked;
          });
        };

        const name=createElement(
          "span","item-name",item.name
        );

        row.append(box,name);

        if(editMode) {
          row.append(
            iconButton("✏️","Rediger ting",
              ()=>editItem(si,ii)),
            iconButton("🗑️","Slet ting",
              ()=>deleteItem(si,ii))
          );
        }

        row.draggable=true;

        wireDrag(row,{type:"item",si,ii},payload=>{
          if(payload.type==="item")
            moveItem(payload.si,payload.ii,si,ii);
        });

        drop.append(row);
      });
    }

    card.append(drop);
    root.append(card);
  });
}

/* OVERSIGT OVER MANGLENDE TING */

function renderMissing() {
  const root=$("missingList");
  root.replaceChildren();

  let missing=0;

  data.categories.forEach(c=>{
    allItems(c).forEach(i=>{
      if(!i.done) missing++;
    });
  });

  $("missingSummary").textContent=
    missing+" ting mangler i alt";

  if(missing===0) {
    root.append(
      createElement("div","empty-message","🎉 Alt er pakket!")
    );
    return;
  }

  data.categories.forEach(c=>{
    const outstanding=[];

    c.sections.forEach((s,si)=>{
      s.items.forEach((item,ii)=>{
        if(!item.done) {
          outstanding.push({
            item,si,ii,section:s.name
          });
        }
      });
    });

    if(!outstanding.length) return;

    const block=createElement("div","missing-category");

    block.append(
      createElement(
        "div","missing-category-title",
        c.icon+" "+c.name
      )
    );

    outstanding.forEach(x=>{
      const row=createElement("div","missing-item");

      const box=document.createElement("input");
      box.type="checkbox";
      box.className="check";

      box.onchange=()=>{
        updateCategory(c.name,cat=>{
          const item=cat.sections[x.si]?.items[x.ii];
          if(item) item.done=true;
        });
      };

      const text=createElement("div","item-name");

      text.append(
        createElement("div","",x.item.name)
      );

      if(x.section!==DEFAULT) {
        text.append(
          createElement(
            "div","missing-section-name",x.section
          )
        );
      }

      row.append(box,text);
      block.append(row);
    });

    root.append(block);
  });
}

/* TILFØJELSE */

function addNamedItem(name,categoryName,sectionName) {
  const trimmed=name.trim();
  if(!trimmed) return false;

  const c=data.categories.find(x=>x.name===categoryName);
  const s=c?.sections.find(x=>x.name===sectionName);

  if(s?.items.some(i=>
    i.name.toLowerCase()===trimmed.toLowerCase()
  )) {
    alert("Tingen findes allerede i denne liste.");
    return false;
  }

  updateCategory(categoryName,cat=>{
    const target=sectionName===DEFAULT
      ? getDefaultSection(cat)
      : cat.sections.find(x=>x.name===sectionName);

    if(!target) return;

    if(!target.items.some(i=>
      i.name.toLowerCase()===trimmed.toLowerCase()
    )) {
      target.items.push({name:trimmed,done:false});
      target.collapsed=false;
    }
  });

  return true;
}

$("quickAddForm").onsubmit=e=>{
  e.preventDefault();

  const c=getCategory();
  if(!c) return;

  const input=$("quickItemInput");

  if(addNamedItem(input.value,c.name,DEFAULT)) {
    input.value="";
  }
};

function addItemToSection(si) {
  const c=getCategory();
  if(!c) return;

  const s=c.sections[si];
  if(!s) return;

  const name=prompt("Tilføj ting til "+s.name+":");

  if(name!==null)
    addNamedItem(name,c.name,s.name);
}

function addSection() {
  const c=getCategory();
  if(!c) return;

  const name=prompt("Navn på ny underkategori:");
  if(name===null) return;

  const trimmed=name.trim();
  if(!trimmed) return;

  if(trimmed===DEFAULT ||
    c.sections.some(s=>
      s.name.toLowerCase()===trimmed.toLowerCase()
    )) {
    alert("Underkategorien findes allerede.");
    return;
  }

  updateCategory(c.name,cat=>{
    cat.sections.push({
      name:trimmed,
      collapsed:false,
      items:[]
    });
  });
}

$("addItemForm").onsubmit=e=>{
  e.preventDefault();

  const name=$("newItemInput").value.trim();

  const indexes=[
    ...document.querySelectorAll(
      "#categoryCheckboxes input:checked"
    )
  ].map(x=>Number(x.value));

  if(!name || !indexes.length) {
    alert("Skriv en ting og vælg mindst én kategori.");
    return;
  }

  const names=indexes
    .map(i=>data.categories[i]?.name)
    .filter(Boolean);

  mutate(next=>{
    names.forEach(n=>{
      const c=next.categories.find(x=>x.name===n);
      if(!c) return;

      const s=getDefaultSection(c);

      if(!s.items.some(i=>
        i.name.toLowerCase()===name.toLowerCase()
      )) {
        s.items.push({name,done:false});
      }
    });
  });

  $("newItemInput").value="";

  document.querySelectorAll(
    "#categoryCheckboxes input"
  ).forEach(x=>x.checked=false);
};

function renderCategoryCheckboxes() {
  const root=$("categoryCheckboxes");
  root.replaceChildren();

  data.categories.forEach((c,i)=>{
    const label=createElement("label");
    label.style.display="block";
    label.style.padding="8px 0";

    const box=document.createElement("input");
    box.type="checkbox";
    box.value=i;

    label.append(
      box,
      document.createTextNode(" "+c.icon+" "+c.name)
    );

    root.append(label);
  });
}

$("addCategoryButton").onclick=()=>{
  const name=$("newCategoryInput").value.trim();
  const icon=$("newCategoryEmojiInput").value.trim();

  if(!name) {
    alert("Skriv et kategorinavn.");
    return;
  }

  if(data.categories.some(c=>
    c.name.toLowerCase()===name.toLowerCase()
  )) {
    alert("Kategorien findes allerede.");
    return;
  }

  mutate(next=>{
    next.categories.push({
      name,icon,
      sections:[
        {name:DEFAULT,collapsed:false,items:[]}
      ]
    });
  });

  $("newCategoryInput").value="";
  $("newCategoryEmojiInput").value="";
};

/* REDIGERING */

function editCategory() {
  const c=getCategory();
  if(!c) return;

  const emoji=prompt("Ret emoji:",c.icon);
  if(emoji===null) return;

  const name=prompt("Ret kategorinavn:",c.name);
  if(name===null || !name.trim()) return;

  const trimmed=name.trim();

  if(data.categories.some(x=>
    x!==c && x.name.toLowerCase()===trimmed.toLowerCase()
  )) {
    alert("Navnet findes allerede.");
    return;
  }

  const oldName=c.name;
  selectedCategory=trimmed;

  updateCategory(oldName,cat=>{
    cat.name=trimmed;
    cat.icon=emoji.trim();
  });
}

function deleteCategory() {
  const c=getCategory();

  if(!c || !confirm(
    "Vil du slette "+c.name+" og alle tingene?"
  )) return;

  const name=c.name;

  selectedCategory="";
  editMode=false;

  mutate(next=>{
    next.categories=next.categories.filter(
      x=>x.name!==name
    );
  });

  showScreen("listScreen");
}

function editSection(si) {
  const c=getCategory();
  const s=c?.sections[si];

  if(!s || s.name===DEFAULT) return;

  const name=prompt("Ret underkategori:",s.name);
  if(name===null || !name.trim()) return;

  const trimmed=name.trim();

  if(c.sections.some((x,i)=>
    i!==si &&
    x.name.toLowerCase()===trimmed.toLowerCase()
  )) {
    alert("Navnet findes allerede.");
    return;
  }

  updateCategory(c.name,cat=>{
    cat.sections[si].name=trimmed;
  });
}

function deleteSection(si) {
  const c=getCategory();
  const s=c?.sections[si];

  if(!s || s.name===DEFAULT) return;

  if(!confirm(
    "Slet underkategorien "+s.name+
    " og alle dens ting?"
  )) return;

  updateCategory(c.name,cat=>{
    cat.sections.splice(si,1);
  });
}

function editItem(si,ii) {
  const c=getCategory();
  const item=c?.sections[si]?.items[ii];
  if(!item) return;

  const name=prompt("Ret ting:",item.name);

  if(name===null || !name.trim()) return;

  updateCategory(c.name,cat=>{
    cat.sections[si].items[ii].name=name.trim();
  });
}

function deleteItem(si,ii) {
  const c=getCategory();
  const item=c?.sections[si]?.items[ii];

  if(!item || !confirm(
    "Vil du slette "+item.name+"?"
  )) return;

  updateCategory(c.name,cat=>{
    cat.sections[si].items.splice(ii,1);
  });
}

function toggleCollapse(si) {
  const c=getCategory();
  if(!c) return;

  updateCategory(c.name,cat=>{
    const s=cat.sections[si];
    if(s) s.collapsed=!s.collapsed;
  });
}

/* DRAG AND DROP */

let activeDrag=null;

function wireDrag(el,payload,onDrop) {
  el.addEventListener("dragstart",e=>{
    if(e.target.closest("input,button")) {
      e.preventDefault();
      return;
    }

    e.stopPropagation();
    activeDrag=payload;
    el.classList.add("dragging");

    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData(
      "text/plain",JSON.stringify(payload)
    );
  });

  el.addEventListener("dragend",()=>{
    activeDrag=null;

    document.querySelectorAll(
      ".dragging,.drag-over"
    ).forEach(x=>{
      x.classList.remove("dragging","drag-over");
    });
  });

  wireDrop(el,onDrop);
}

function wireDrop(el,onDrop) {
  el.addEventListener("dragover",e=>{
    if(!activeDrag) return;

    e.preventDefault();
    e.stopPropagation();

    el.classList.add("drag-over");
  });

  el.addEventListener("dragleave",e=>{
    if(!el.contains(e.relatedTarget))
      el.classList.remove("drag-over");
  });

  el.addEventListener("drop",e=>{
    if(!activeDrag) return;

    e.preventDefault();
    e.stopPropagation();

    el.classList.remove("drag-over");

    const payload=activeDrag;
    activeDrag=null;

    onDrop(payload);
  });
}

function moveSection(from,to) {
  const c=getCategory();

  if(!c || from===to) return;

  if(c.sections[from]?.name===DEFAULT ||
     c.sections[to]?.name===DEFAULT) return;

  updateCategory(c.name,cat=>{
    const moved=cat.sections.splice(from,1)[0];
    cat.sections.splice(to,0,moved);
  });
}

function moveItem(fromSi,fromIi,toSi,toIi) {
  const c=getCategory();
  if(!c) return;

  updateCategory(c.name,cat=>{
    const source=cat.sections[fromSi];
    const target=cat.sections[toSi];

    if(!source || !target ||
       !source.items[fromIi]) return;

    const moved=source.items.splice(fromIi,1)[0];

    if(fromSi===toSi && fromIi<toIi) toIi--;

    target.items.splice(
      Math.max(0,toIi),0,moved
    );

    target.collapsed=false;
  });
}

/* NAVIGATION */

function showScreen(id) {
  currentScreen=id;

  if(id!=="detailScreen") editMode=false;

  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.toggle("active",s.id===id);
  });

  render();
  window.scrollTo(0,0);
}

$("editNavButton").onclick=()=>{
  if(currentScreen!=="detailScreen") return;

  editMode=!editMode;
  render();
};

document.querySelectorAll("[data-screen]").forEach(btn=>{
  btn.onclick=()=>showScreen(btn.dataset.screen);
});

function startNewTrip() {
  if(!confirm(
    "Vil du nulstille alle afkrydsninger for hele familien?"
  )) return;

  mutate(next=>{
    next.categories.forEach(c=>{
      allItems(c).forEach(i=>i.done=false);
    });
  });

  editMode=false;
}

$("missingShortcut").onclick=
  ()=>showScreen("missingScreen");

$("newTripShortcut").onclick=startNewTrip;
$("newTripNavButton").onclick=startNewTrip;

/* LOGIN */

$("loginButton").onclick=async()=>{
  try {
    $("loginError").textContent="";

    await signInWithEmailAndPassword(
      auth,
      $("emailInput").value.trim(),
      $("passwordInput").value
    );
  } catch(error) {
    $("loginError").textContent=
      "Kunne ikke logge ind. Tjek email og kodeord.";
  }
};

$("signupButton").onclick=async()=>{
  try {
    $("loginError").textContent="";

    await createUserWithEmailAndPassword(
      auth,
      $("emailInput").value.trim(),
      $("passwordInput").value
    );
  } catch(error) {
    $("loginError").textContent=
      "Kunne ikke oprette bruger. Tjek email og kodeord.";
  }
};

$("logoutButton").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  if(unsubscribe) {
    unsubscribe();
    unsubscribe=null;
  }

  dataRef=null;
  loaded=false;
  data={categories:[]};
  selectedCategory="";
  editMode=false;

  if(!user) {
    $("appShell").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
    return;
  }

  $("loginScreen").classList.add("hidden");
  $("appShell").classList.remove("hidden");

  $("userEmail").textContent=user.email||"";

  showScreen("listScreen");

  dataRef=ref(db,"families/"+FAMILY_ID);
  const activeRef=dataRef;

  unsubscribe=onValue(activeRef,async snapshot=>{
    if(dataRef!==activeRef) return;

    if(!snapshot.exists()) {
      try {
        await runTransaction(activeRef,current=>
          current===null ? initialData : undefined,
          {applyLocally:false}
        );
      } catch(error) {
        console.error(error);
        alert("Kunne ikke åbne pakkelisten.");
      }
      return;
    }

    data=normalizeData(snapshot.val());
    loaded=true;

    if(!getCategory()) {
      selectedCategory=data.categories[0]?.name||"";
    }

    render();

  },error=>{
    console.error(error);
    alert(
      "Adgang til Firebase blev afvist. Kontrollér reglerne."
    );
  });
});
